      function notifyCopied(content) {
          const message = "Address Copied!";

          const notification = document.createElement("div");
          notification.innerText = message;
          notification.classList.add("notification");

          const container = document.getElementById("container");
          container.appendChild(notification);

          setTimeout(function () {
          notification.classList.add("fade-out");
          setTimeout(function () {
              container.removeChild(notification);
          }, 500);
          }, 1500);
      }
      function includeHTML() {
        var z, i, elmnt, file, xhttp;
        /* Loop through a collection of all HTML elements: */
        z = document.getElementsByTagName("*");
        for (i = 0; i < z.length; i++) {
          elmnt = z[i];
          /*search for elements with a certain atrribute:*/
          file = elmnt.getAttribute("w3-include-html");
          if (file) {
            /* Make an HTTP request using the attribute value as the file name: */
            xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function () {
              if (this.readyState == 4) {
                if (this.status == 200) {
                  elmnt.innerHTML = this.responseText;
                }
                if (this.status == 404) {
                  elmnt.innerHTML = "Page not found.";
                }
                /* Remove the attribute, and call this function once more: */
                loaded();
                elmnt.removeAttribute("w3-include-html");
                includeHTML();
              }
            };
            xhttp.open("GET", file, true);
            xhttp.send();
            /* Exit the function: */
            return;
          }
        }
      }
      function getCookie(cname) {
        let name = cname + "=";
        let decodedCookie = decodeURIComponent(document.cookie);
        let ca = decodedCookie.split(";");
        for (let i = 0; i < ca.length; i++) {
          let c = ca[i];
          while (c.charAt(0) == " ") {
            c = c.substring(1);
          }
          if (c.indexOf(name) == 0) {
            return c.substring(name.length, c.length);
          }
        }
        return "";
      }
      window.onload = () => {
        includeHTML();
        loadTournaments();
      };
      function loaded() {
        let username = getCookie("username");
        let accHandler = document.getElementById("accountHandler");
        if (username) {
          accHandler.innerHTML = "Sign Out (" + username + ")";
          accHandler.href =
            "https://sso.smach.us/?signOut=true&redirect=https://machtarok.com/";
        } else {
          accHandler.hidden = "hidden";
        }
      }
      
      function formatPhone(number) {
        const n = '' + number;
        return `+1 (${n.substring(0,3)}) ${n.substring(3,6)}-${n.substring(6)}`;
      }

      function createTournamentElement(tournament) {
            const col = document.createElement('div');
            col.className = 'col-md-8 col-lg-6 mb-3';

            const card = document.createElement('div');
            card.className = 'card shadow-sm hover-shadow border-0 p-3 bg-light h-100';

            // Tournament location
            const location = document.createElement('h3');
            location.className = 'btn-title mb-1';
            location.textContent = tournament.location;

            // Tournament date
            const date = document.createElement('div');
            date.className = 'text-muted mb-2';
            date.textContent = tournament.date.toLocaleDateString();

            // Address
            const address = document.createElement('div');
            address.className = 'mb-3';

            const addressLink = document.createElement('a');
            addressLink.href = '#';
            addressLink.textContent = tournament.address;
            addressLink.className = 'small-link';

            // Copy address when clicked
            addressLink.addEventListener('click', async (event) => {
                event.preventDefault();

                await navigator.clipboard.writeText(tournament.address);
                notifyCopied(tournament.address);
            });

            address.appendChild(addressLink);

            // Contacts
            const contacts = document.createElement('div');

            if (tournament.contacts.length) {
                const contactsHeader = document.createElement('p');
                contactsHeader.textContent = 'Contacts';
                contactsHeader.className = 'btn-title mb-1';

                contacts.appendChild(contactsHeader);
            }

            for (const contact of tournament.contacts) {
                const contactDiv = document.createElement('div');
                contactDiv.className = 'mb-2';

                // Name
                const name = document.createElement('div');
                name.textContent = contact.name;
                
                // Put phone and email next to each other
                const contactLinks = document.createElement('div');

                // Phone
                if (contact.phone) {
                    const phone = document.createElement('a');
                    phone.href = `tel:${contact.phone}`;
                    phone.className = 'me-2 small-link';

                    const phoneIcon = document.createElement('img');
                    phoneIcon.src = '/assets/icons/phone.svg';
                    phoneIcon.alt = 'Phone';

                    const phoneText = document.createElement('span');
                    phoneText.textContent = formatPhone(contact.phone);

                    phone.appendChild(phoneIcon);
                    phone.appendChild(phoneText);
                    contactLinks.appendChild(phone);
                }


                // Email
                if (contact.email) {
                    const email = document.createElement('a');
                    email.href = `mailto:${contact.email}`;
                    email.className = 'small-link'

                    const emailIcon = document.createElement('img');
                    emailIcon.src = '/assets/icons/email.svg';
                    emailIcon.alt = 'Email';

                    const emailText = document.createElement('span');
                    emailText.textContent = contact.email;

                    email.appendChild(emailIcon);
                    email.appendChild(emailText);
                    contactLinks.appendChild(email);
                }


                contactDiv.appendChild(name);
                contactDiv.appendChild(contactLinks);

                contacts.appendChild(contactDiv);
            }

            // Assemble card
            card.appendChild(location);
            card.appendChild(date);
            card.appendChild(address);
            card.appendChild(contacts);

            col.appendChild(card);

            return col;
        }
